<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | VibeConnect</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #fff7f1, #f1edff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            border-radius: 26px;
            box-shadow: 0 20px 60px rgba(67, 48, 120, 0.12);
            border: 1px solid #f1edf8;
        }

        .logo {
            text-align: center;
            font-size: 29px;
            font-weight: 800;
            color: #6554c0;
            margin-bottom: 28px;
            letter-spacing: -1px;
        }

        .logo span {
            color: #f07878;
        }

        h2 {
            text-align: center;
            color: #29243d;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #858195;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .message {
            background: #fff0f2;
            color: #c3445b;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #514b68;
            font-size: 13px;
            font-weight: 600;
            margin: 15px 0 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e5e0ed;
            border-radius: 12px;
            font-size: 15px;
            background: #fcfbff;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #8978dc;
            background: white;
            box-shadow: 0 0 0 4px #6554c015;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            background: linear-gradient(135deg, #6554c0, #8b70db);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px #6554c033;
        }

        .bottom {
            text-align: center;
            margin-top: 24px;
            color: #858195;
            font-size: 14px;
        }

        a {
            color: #6554c0;
            text-decoration: none;
            font-weight: 700;
        }

        a:hover {
            color: #f07878;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #9992aa;
        }

        @media (max-width: 480px) {
            .card {
                padding: 30px 24px;
            }

            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>
    <div class="card">

        <div class="logo">
            VibeConnect <span>✦</span>
        </div>

        <h2>Create your account</h2>

        <p class="subtitle">
            Join the community and share your vibe.
        </p>

        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                autocomplete="username"
                required
            >

            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter yoyr registered email"
                autocomplete="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
            >

            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Enter your password again"
                autocomplete="new-password"
                required
            >

            <button type="submit">Create Account →</button>
        </form>

        <p class="bottom">
            Already a member?
            <a href="{% url 'login' %}">Log in</a>
        </p>

        <a class="home-link" href="{% url 'home' %}">
            ← Back to Home
        </a>

    </div>
</body>
</html>
